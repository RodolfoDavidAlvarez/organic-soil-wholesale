    <!-- Keep operational/direct-help pages on the official support line.
         Path list must stay in sync with client/src/lib/callTracking.ts -->
    <script>
      // Set exclusion attributes immediately before React loads
      (function() {
        const path = window.location.pathname;
        const source = new URLSearchParams(window.location.search).get('source');
        const excludeFromCallTracking =
          document.documentElement.dataset.siteBrand === 'rls' ||
          path.startsWith('/rep/') ||
          path === '/free-worm-castings' ||
          path.startsWith('/landscaper-supply') ||
          path === '/survey' ||
          path.startsWith('/survey/') ||
          (path === '/newsletter' && source === 'july-community-gift') ||
          path === '/qr' ||
          path === '/check-in' ||
          path === '/yard-map' ||
          path === '/checkout' ||
          path === '/order-confirmation' ||
          path.startsWith('/pay-and-pickup') ||
          path.startsWith('/drive-through');

        if (excludeFromCallTracking) {
          document.documentElement.setAttribute('data-callrail-ignore', 'true');
          document.documentElement.setAttribute('data-dynamic-number-ignore', 'true');
          document.documentElement.setAttribute('data-call-tracking-ignore', 'true');
          document.documentElement.classList.add('no-call-tracking');
          if (document.body) {
            document.body.setAttribute('data-callrail-ignore', 'true');
            document.body.setAttribute('data-dynamic-number-ignore', 'true');
            document.body.setAttribute('data-call-tracking-ignore', 'true');
            document.body.classList.add('no-call-tracking');
          }
        }
      })();
    </script>
